services:
  db:
    image: mysql:8
    container_name: ab-medical-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: salestracking_db
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: ab-medical-be
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: mysql://root:rootpass@db:3306/salestracking_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: